name: PDF Ingest

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: husik-pdf-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: Install python dependencies
        run: pip install -e .

      - name: Validate environment (includes channel ID format check)
        env:
          TELEGRAM_AUCTION_BOT_TOKEN: ${{ secrets.TELEGRAM_AUCTION_BOT_TOKEN }}
          TELEGRAM_AUDIO_BOT_TOKEN: ${{ secrets.TELEGRAM_AUDIO_BOT_TOKEN }}
          TELEGRAM_AUCTION_CHANNEL_ID: ${{ secrets.TELEGRAM_AUCTION_CHANNEL_ID }}
          TELEGRAM_AUDIO_CHANNEL_ID: ${{ secrets.TELEGRAM_AUDIO_CHANNEL_ID }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_AUCTION_DB_URL: ${{ secrets.NOTION_AUCTION_DB_URL }}
          NOTION_HUSIK_DB_ID: ${{ secrets.NOTION_HUSIK_DB_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m husik.cli validate-env

      - name: Telegram PDF ingest
        id: ingest
        env:
          TELEGRAM_AUCTION_BOT_TOKEN: ${{ secrets.TELEGRAM_AUCTION_BOT_TOKEN }}
          TELEGRAM_AUDIO_BOT_TOKEN: ${{ secrets.TELEGRAM_AUDIO_BOT_TOKEN }}
          TELEGRAM_AUCTION_CHANNEL_ID: ${{ secrets.TELEGRAM_AUCTION_CHANNEL_ID }}
          TELEGRAM_AUDIO_CHANNEL_ID: ${{ secrets.TELEGRAM_AUDIO_CHANNEL_ID }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_AUCTION_DB_URL: ${{ secrets.NOTION_AUCTION_DB_URL }}
          NOTION_HUSIK_DB_ID: ${{ secrets.NOTION_HUSIK_DB_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          COURT_AUCTION_ENABLED: ${{ secrets.COURT_AUCTION_ENABLED }}
          MADANGS_ENABLED: ${{ secrets.MADANGS_ENABLED }}
          BLOG_MONITOR_ENABLED: ${{ secrets.BLOG_MONITOR_ENABLED }}
        run: python -m husik.cli telegram-pdf-ingest

      - name: Print safe summary on failure
        if: failure() && steps.ingest.outcome == 'failure'
        run: |
          echo "PDF ingest step failed. See the 'Telegram PDF ingest' step log above for"
          echo "PDF_INGEST_STAT counters and error details (no secrets are logged there)."

      - name: Commit state changes
        if: always()
        run: |
          git config user.name "husik-bot"
          git config user.email "husik-bot@users.noreply.github.com"
          git add data/state
          if ! git diff --cached --quiet; then
            git commit -m "chore: update state [skip ci]"
            git push
          else
            echo "no state changes to commit"
          fi
